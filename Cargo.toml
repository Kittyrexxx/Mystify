[package]
name = "mystify"
version = "1.2.1"
edition = "2021"

[dependencies]
colored = "2.1.0"
inquire = "0.7.5"
base64 = "0.22.1"
hex = "0.4.3"
urlencoding = "2.1.3"
chrono = "0.4.38"
rand = "0.8.5"
local-ip-address = "0.6.1"
regex = "1.10.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0"
aes-gcm = "0.10.3"
rfd = "0.14.1"
crossterm = "0.27"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase"] }

